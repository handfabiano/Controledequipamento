name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Backend (sintaxe + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checar sintaxe dos arquivos do servidor
        run: |
          for f in $(find server -name '*.js'); do
            node --check "$f"
          done

      - name: Smoke test (SQLite)
        run: |
          PORT=3101 node server/index.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3101/health > /dev/null; then
              echo "Servidor respondeu ao health check"
              break
            fi
            if [ "$i" = "20" ]; then
              echo "Servidor não subiu a tempo"
              exit 1
            fi
            sleep 1
          done
          # Login com usuário seed deve funcionar
          curl -sf -X POST http://localhost:3101/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"coordenador@sistema.com","senha":"123456"}' | grep -q token
          echo "Login OK"
          kill $SERVER_PID

  client:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção
        run: npm run build
